<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phòng Thí Nghiệm Toán Học (Math Lab)</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/p5.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Lora:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --anthropic-dark: #141413;
            --anthropic-light: #faf9f5;
            --anthropic-mid-gray: #b0aea5;
            --anthropic-light-gray: #e8e6dc;
            --anthropic-orange: #d97757;
            --anthropic-blue: #6a9bcc;
            --anthropic-green: #788c5d;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, var(--anthropic-light) 0%, #f5f3ee 100%);
            min-height: 100vh;
            color: var(--anthropic-dark);
        }
        .container { display: flex; min-height: 100vh; padding: 20px; gap: 20px; }
        .sidebar {
            width: 320px; flex-shrink: 0; background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px); padding: 24px; border-radius: 12px;
            box-shadow: 0 10px 30px rgba(20, 20, 19, 0.1); overflow-y: auto; overflow-x: hidden;
        }
        .sidebar h1 { font-family: 'Lora', serif; font-size: 24px; font-weight: 500; color: var(--anthropic-dark); margin-bottom: 8px; }
        .sidebar .subtitle { color: var(--anthropic-mid-gray); font-size: 14px; margin-bottom: 32px; line-height: 1.4; }
        .control-section { margin-bottom: 32px; }
        .control-section h3 { font-size: 16px; font-weight: 600; color: var(--anthropic-dark); margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
        .control-section h3::before { content: '•'; color: var(--anthropic-orange); font-weight: bold; }
        .seed-input { width: 100%; background: var(--anthropic-light); padding: 12px; border-radius: 8px; font-family: 'Courier New', monospace; font-size: 14px; margin-bottom: 12px; border: 1px solid var(--anthropic-light-gray); text-align: center; }
        .seed-input:focus { outline: none; border-color: var(--anthropic-orange); box-shadow: 0 0 0 2px rgba(217, 119, 87, 0.1); background: white; }
        .seed-controls { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
        .regen-button { margin-bottom: 0; }
        .control-group { margin-bottom: 20px; }
        .control-group label { display: block; font-size: 14px; font-weight: 500; color: var(--anthropic-dark); margin-bottom: 8px; }
        .slider-container { display: flex; align-items: center; gap: 12px; }
        .slider-container input[type="range"] { flex: 1; height: 4px; background: var(--anthropic-light-gray); border-radius: 2px; outline: none; -webkit-appearance: none; }
        .slider-container input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; background: var(--anthropic-orange); border-radius: 50%; cursor: pointer; transition: all 0.2s ease; }
        .slider-container input[type="range"]::-webkit-slider-thumb:hover { transform: scale(1.1); background: #c86641; }
        .value-display { font-family: 'Courier New', monospace; font-size: 12px; color: var(--anthropic-mid-gray); min-width: 60px; text-align: right; }
        .color-group { margin-bottom: 16px; }
        .color-group label { display: block; font-size: 12px; color: var(--anthropic-mid-gray); margin-bottom: 4px; }
        .color-picker-container { display: flex; align-items: center; gap: 8px; }
        .color-picker-container input[type="color"] { width: 32px; height: 32px; border: none; border-radius: 6px; cursor: pointer; background: none; padding: 0; }
        .color-value { font-family: 'Courier New', monospace; font-size: 12px; color: var(--anthropic-mid-gray); }
        .button { background: var(--anthropic-orange); color: white; border: none; padding: 10px 16px; border-radius: 6px; font-size: 14px; font-weight: 500; cursor: pointer; transition: all 0.2s ease; width: 100%; }
        .button:hover { background: #c86641; transform: translateY(-1px); }
        .button:active { transform: translateY(0); }
        .button.secondary { background: var(--anthropic-blue); }
        .button.secondary:hover { background: #5a8bb8; }
        .button.tertiary { background: var(--anthropic-green); }
        .button.tertiary:hover { background: #6b7b52; }
        .button-row { display: flex; gap: 8px; }
        .button-row .button { flex: 1; }
        .canvas-area { flex: 1; display: flex; align-items: center; justify-content: center; min-width: 0; }
        #canvas-container { width: 100%; max-width: 1000px; border-radius: 12px; overflow: hidden; box-shadow: 0 20px 40px rgba(20, 20, 19, 0.1); background: white; }
        #canvas-container canvas { display: block; width: 100% !important; height: auto !important; }
        .loading { display: flex; align-items: center; justify-content: center; font-size: 18px; color: var(--anthropic-mid-gray); padding: 40px; }
        @media (max-width: 600px) { .container { flex-direction: column; } .sidebar { width: 100%; } .canvas-area { padding: 20px; } }
    </style>
</head>
<body>
    <div class="container">
        <!-- Control Sidebar -->
        <div class="sidebar">
            <h1>Phòng Thí Nghiệm</h1>
            <div class="subtitle">Trigonometric Harmonics (Mô phỏng Lượng Giác)</div>

            <div class="control-section">
                <h3>Seed</h3>
                <input type="number" id="seed-input" class="seed-input" value="12345" onchange="updateSeed()">
                <div class="seed-controls">
                    <button class="button secondary" onclick="previousSeed()">← Prev</button>
                    <button class="button secondary" onclick="nextSeed()">Next →</button>
                </div>
                <button class="button tertiary regen-button" onclick="randomSeedAndUpdate()">↻ Random</button>
            </div>

            <div class="control-section">
                <h3>Toán học (Lượng giác)</h3>
                <div class="control-group">
                    <label>Tần số X (Freq X)</label>
                    <div class="slider-container">
                        <input type="range" id="freqX" min="1" max="15" step="0.5" value="3" oninput="updateParam('freqX', this.value)">
                        <span class="value-display" id="freqX-value">3</span>
                    </div>
                </div>
                <div class="control-group">
                    <label>Tần số Y (Freq Y)</label>
                    <div class="slider-container">
                        <input type="range" id="freqY" min="1" max="15" step="0.5" value="2" oninput="updateParam('freqY', this.value)">
                        <span class="value-display" id="freqY-value">2</span>
                    </div>
                </div>
                <div class="control-group">
                    <label>Độ lệch pha (Phase)</label>
                    <div class="slider-container">
                        <input type="range" id="phaseShift" min="0" max="6.28" step="0.1" value="1.57" oninput="updateParam('phaseShift', this.value)">
                        <span class="value-display" id="phaseShift-value">1.57</span>
                    </div>
                </div>
                <div class="control-group">
                    <label>Nhiễu loạn (Noise Chaos)</label>
                    <div class="slider-container">
                        <input type="range" id="noiseLevel" min="0" max="100" step="1" value="20" oninput="updateParam('noiseLevel', this.value)">
                        <span class="value-display" id="noiseLevel-value">20</span>
                    </div>
                </div>
                <div class="control-group">
                    <label>Số lượng hạt</label>
                    <div class="slider-container">
                        <input type="range" id="particleCount" min="100" max="1500" step="50" value="500" oninput="updateParam('particleCount', this.value)">
                        <span class="value-display" id="particleCount-value">500</span>
                    </div>
                </div>
            </div>

            <div class="control-section">
                <h3>Màu sắc</h3>
                <div class="color-group">
                    <label>Màu Vệt Sáng (Trails)</label>
                    <div class="color-picker-container">
                        <input type="color" id="color1" value="#6a9bcc" onchange="updateColor('color1', this.value)">
                        <span class="color-value" id="color1-value">#6a9bcc</span>
                    </div>
                </div>
                <div class="color-group">
                    <label>Màu Nền</label>
                    <div class="color-picker-container">
                        <input type="color" id="color2" value="#141413" onchange="updateColor('color2', this.value)">
                        <span class="color-value" id="color2-value">#141413</span>
                    </div>
                </div>
            </div>

            <div class="control-section">
                <h3>Hành động</h3>
                <div class="button-row">
                    <button class="button" onclick="resetParameters()">Đặt lại (Reset)</button>
                </div>
            </div>
        </div>

        <div class="canvas-area">
            <div id="canvas-container">
                <div class="loading">Đang tải Phòng Thí Nghiệm Toán...</div>
            </div>
        </div>
    </div>

    <script>
        let params = {
            seed: 12345,
            freqX: 3,
            freqY: 2,
            phaseShift: 1.57, // PI/2
            noiseLevel: 20,
            particleCount: 500,
            colorPalette: ['#6a9bcc', '#141413']
        };

        let defaultParams = {...params};
        let particles = [];
        let t = 0; // global time for animation

        function setup() {
            let canvas = createCanvas(800, 800);
            canvas.parent('canvas-container');
            initializeSystem();
            document.querySelector('.loading').style.display = 'none';
        }

        function hexToRgb(hex) {
            let result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
            return result ? {
                r: parseInt(result[1], 16),
                g: parseInt(result[2], 16),
                b: parseInt(result[3], 16)
            } : { r: 255, g: 255, b: 255 };
        }

        function initializeSystem() {
            randomSeed(params.seed);
            noiseSeed(params.seed);
            particles = [];
            
            for (let i = 0; i < params.particleCount; i++) {
                particles.push(new Particle(i));
            }
            
            let bgRgb = hexToRgb(params.colorPalette[1]);
            background(bgRgb.r, bgRgb.g, bgRgb.b);
            t = 0;
        }

        function draw() {
            let bgRgb = hexToRgb(params.colorPalette[1]);
            // Draw a semi-transparent background to create trails
            fill(bgRgb.r, bgRgb.g, bgRgb.b, 20);
            noStroke();
            rect(0, 0, width, height);
            
            // Move and draw particles
            for (let i = 0; i < particles.length; i++) {
                particles[i].update();
                particles[i].display();
            }
            t += 0.01;
        }

        class Particle {
            constructor(index) {
                this.index = index;
                this.x = width / 2;
                this.y = height / 2;
                // Base phase for this particle so they don't all clump together
                this.basePhase = map(index, 0, params.particleCount, 0, TWO_PI);
                // Radius variation
                this.rOffset = random(0.5, 1.0);
            }
            
            update() {
                // Trigonometric Lissajous equation
                let A = (width / 2.5) * this.rOffset;
                let B = (height / 2.5) * this.rOffset;
                
                // Pure Math part
                let mathX = A * sin(params.freqX * t + this.basePhase + params.phaseShift);
                let mathY = B * sin(params.freqY * t + this.basePhase);
                
                // Chaos/Noise part
                let nX = map(noise(this.index * 0.1, t, 0), 0, 1, -1, 1) * params.noiseLevel * 5;
                let nY = map(noise(this.index * 0.1, t, 100), 0, 1, -1, 1) * params.noiseLevel * 5;
                
                this.x = width / 2 + mathX + nX;
                this.y = height / 2 + mathY + nY;
            }
            
            display() {
                let trailRgb = hexToRgb(params.colorPalette[0]);
                // Color mapping based on position for a subtle gradient effect
                let colorVariationR = map(this.x, 0, width, -30, 30);
                let colorVariationB = map(this.y, 0, height, -30, 30);
                
                fill(trailRgb.r + colorVariationR, trailRgb.g, trailRgb.b + colorVariationB, 150);
                noStroke();
                ellipse(this.x, this.y, 3, 3);
            }
        }

        function updateParam(paramName, value) {
            params[paramName] = parseFloat(value);
            document.getElementById(paramName + '-value').textContent = value;
            if (paramName === 'particleCount') {
                initializeSystem();
            }
        }

        function updateColor(colorId, value) {
            document.getElementById(colorId + '-value').textContent = value;
            if (colorId === 'color1') params.colorPalette[0] = value;
            if (colorId === 'color2') params.colorPalette[1] = value;
            if (colorId === 'color2') initializeSystem(); // Reset bg if bg changes
        }

        function updateSeedDisplay() {
            document.getElementById('seed-input').value = params.seed;
        }

        function updateSeed() {
            let input = document.getElementById('seed-input');
            let newSeed = parseInt(input.value);
            if (newSeed && newSeed > 0) {
                params.seed = newSeed;
                initializeSystem();
            } else {
                updateSeedDisplay();
            }
        }

        function previousSeed() { params.seed = Math.max(1, params.seed - 1); updateSeedDisplay(); initializeSystem(); }
        function nextSeed() { params.seed = params.seed + 1; updateSeedDisplay(); initializeSystem(); }
        function randomSeedAndUpdate() { params.seed = Math.floor(Math.random() * 999999) + 1; updateSeedDisplay(); initializeSystem(); }

        function resetParameters() {
            params = {...defaultParams};
            params.colorPalette = [...defaultParams.colorPalette];
            
            ['freqX', 'freqY', 'phaseShift', 'noiseLevel', 'particleCount'].forEach(p => {
                document.getElementById(p).value = params[p];
                document.getElementById(p + '-value').textContent = params[p];
            });
            
            document.getElementById('color1').value = params.colorPalette[0];
            document.getElementById('color1-value').textContent = params.colorPalette[0];
            document.getElementById('color2').value = params.colorPalette[1];
            document.getElementById('color2-value').textContent = params.colorPalette[1];
            
            updateSeedDisplay();
            initializeSystem();
        }

        window.addEventListener('load', function() {
            updateSeedDisplay();
        });
    </script>
</body>
</html>
